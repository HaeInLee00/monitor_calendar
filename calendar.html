<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>생산 일정 · 자재 관리</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --line: #dfe3ea;
    --line-soft: #eef1f5;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --danger: #dc2626;
    --ok: #059669;
    --warn: #d97706;
    --off-bg: #f3f4f6;
    --sun: #dc2626;
    --sat: #2563eb;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    min-width: 1280px;
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 13px;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #f8fafc; border-color: #c7cdd8; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { color: var(--danger); }
  button.danger:hover { background: #fef2f2; border-color: #fca5a5; }
  button.ghost { border-color: transparent; background: transparent; }
  button.sm { padding: 3px 8px; font-size: 12px; }
  input[type=text], input[type=number], input[type=date], input:not([type]), select {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  a.link { color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* ---------- 상단 ---------- */
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: nowrap;
    background: #fff; border-bottom: 1px solid var(--line); padding: 0 16px; min-height: 52px;
  }
  header.top h1 { font-size: 16px; margin: 0; padding-block: 12px; }
  .tabs { display: flex; gap: 2px; align-self: stretch; }
  .tab {
    border: none; border-radius: 0; background: none; padding: 0 16px; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent;
  }
  .tab:hover { background: #f8fafc; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; padding-block: 8px; }
  .save-state { color: var(--muted); font-size: 12px; }
  .notice {
    background: #fffbeb; border-bottom: 1px solid #fde68a; color: #92400e; padding: 6px 16px; font-size: 12px;
    display: flex; gap: 8px; align-items: center;
  }
  .notice button { margin-left: auto; }

  main { padding: 12px 16px; }
  .tab-page[hidden] { display: none !important; }

  /* ---------- 탭1: 생산 일정 ---------- */
  .sched-layout { display: grid; grid-template-columns: 380px 1fr; gap: 12px; height: calc(100vh - 52px - 24px - var(--notice-h, 0px)); min-height: 560px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .pane-head h2 { font-size: 14px; margin: 0; }
  .pane-body { overflow: auto; padding: 10px; flex: 1; min-height: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 10px; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }

  .empty { color: var(--muted); text-align: center; padding: 32px 12px; line-height: 1.7; }

  .mcard { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: var(--radius); margin-bottom: 10px; background: #fff; }
  .mcard-top { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px; }
  .m-color { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .m-name { flex: 1; font-weight: 700; font-size: 14px; border-color: transparent !important; }
  .m-name:hover { border-color: var(--line) !important; }
  .mline { border-top: 1px dashed var(--line); padding: 8px 10px; }
  .mline.disabled .mline-grid, .mline.disabled .mline-dyn { display: none; }
  .mline-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .line-tag { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; cursor: pointer; }
  .line-tag.lcm { background: #e0ecff; color: #1e40af; }
  .line-tag.set { background: #dcfce7; color: #166534; }
  .mline.disabled .line-tag { background: var(--off-bg); color: var(--muted); }
  .mline-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; }
  .mline-grid label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .mline-grid input { width: 100%; padding: 4px 6px; }
  .mline-dyn { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .mline-dyn b { color: var(--text); }
  .progress { height: 6px; background: var(--line-soft); border-radius: 999px; overflow: hidden; margin: 3px 0; }
  .progress > div { height: 100%; background: var(--c, var(--accent)); }
  .status { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--off-bg); color: var(--muted); }
  .status.st-run { background: #dbeafe; color: #1d4ed8; }
  .status.st-plan { background: #fef3c7; color: #92400e; }
  .status.st-done { background: #dcfce7; color: #166534; }
  .warn { color: var(--danger); font-weight: 600; }

  /* 달력 */
  .cal-title { font-size: 16px; font-weight: 700; min-width: 110px; text-align: center; }
  .cal-summary { margin-left: auto; font-size: 12px; color: var(--muted); }
  .cal-summary b { color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(96px, 1fr); flex: 1; min-height: 0; border-top: 1px solid var(--line); }
  .cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-weight: 600; font-size: 12px; padding: 6px 0; color: var(--muted); }
  .cal-dow div:first-child { color: var(--sun); }
  .cal-dow div:last-child { color: var(--sat); }
  .cal-cell { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 3px 4px; display: flex; flex-direction: column; min-height: 0; min-width: 0; cursor: pointer; position: relative; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:hover { background: #f8fbff; }
  .cal-cell.off { background: var(--off-bg); }
  .cal-cell.off:hover { background: #eceef2; }
  .cal-cell.other { opacity: .45; }
  .cal-cell.today .dnum { background: var(--accent); color: #fff; border-radius: 999px; }
  .cal-head { display: flex; align-items: center; gap: 4px; min-height: 20px; }
  .dnum { font-weight: 600; font-size: 12px; min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
  .cal-cell.sun .dnum, .cal-cell.hol .dnum { color: var(--sun); }
  .cal-cell.sat .dnum { color: var(--sat); }
  .cal-cell.today .dnum { color: #fff; }
  .hname { font-size: 10px; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hname.work { color: var(--ok); }
  .chips { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
  .chip {
    display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1.3; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--c); white-space: nowrap; overflow: hidden; cursor: pointer; flex-shrink: 0;
  }
  .chip.lcm { background: var(--c); color: #fff; }
  .chip.set { background: #fff; color: var(--c); }
  .chip:hover { filter: brightness(1.08); box-shadow: 0 0 0 2px rgba(37,99,235,.25); }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chip .ln { font-size: 9px; font-weight: 700; opacity: .85; }
  .chip .ov { font-size: 9px; }
  .cal-sum { font-size: 10px; color: var(--muted); text-align: right; padding-top: 1px; }

  /* ---------- 탭2: 자재 ---------- */
  .mat-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .mat-toolbar .grow { flex: 1; }
  .mat-toolbar input.search { width: 220px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; min-width: 110px; text-align: left; }
  .stat .v { font-size: 18px; font-weight: 700; display: block; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .stat.red .v { color: var(--danger); }
  .table-wrap { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 230px); }
  table.mat { border-collapse: collapse; width: 100%; min-width: 1150px; }
  table.mat th, table.mat td { border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); padding: 0; }
  table.mat th { position: sticky; top: 0; background: #f1f5f9; z-index: 1; font-size: 12px; padding: 8px 6px; text-align: center; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
  table.mat th.nosort { cursor: default; }
  table.mat th .arrow { color: var(--accent); font-size: 10px; }
  table.mat td.chk, table.mat th.chk { width: 34px; text-align: center; }
  table.mat td.idx { width: 40px; text-align: center; color: var(--muted); font-size: 11px; }
  table.mat tr:hover td { background: #fafcff; }
  table.mat tr.sel td { background: #eef4ff; }
  .cell { width: 100%; border: 1px solid transparent !important; border-radius: 0 !important; background: transparent !important; padding: 7px 6px !important; }
  .cell:focus { border-color: var(--accent) !important; background: #fff !important; outline: none; }
  .cell.num { text-align: right; }
  .cell.code::placeholder { color: var(--danger); font-weight: 700; opacity: 1; }
  select.cell { cursor: pointer; }
  select.cell[data-v="승인"] { color: var(--ok); font-weight: 600; }
  select.cell[data-v="미승인"] { color: var(--danger); font-weight: 600; }
  select.cell[data-v="보류"] { color: var(--warn); font-weight: 600; }
  select.cell[data-v="입고완료"] { color: var(--ok); font-weight: 600; }
  select.cell[data-v="미발주"] { color: var(--danger); }
  select.cell[data-v="발주완료"], select.cell[data-v="입고대기"] { color: var(--accent); font-weight: 600; }

  /* ---------- 모달 ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px 16px; z-index: 100; overflow: auto; }
  .modal { background: #fff; border-radius: 10px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .modal.wide { max-width: 680px; }
  .modal-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-head .x { margin-left: auto; }
  .modal-body { padding: 14px 16px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .modal-foot .left { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-row > span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .form-inline { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .form-inline .form-row { flex: 1; min-width: 110px; }
  .line-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 2px; margin-bottom: 10px; }
  .line-box legend { font-weight: 700; padding: 0 6px; }
  .preview { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .preview b { color: var(--accent); }
  .section-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .day-list { display: flex; flex-direction: column; gap: 4px; }
  .day-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line-soft); border-radius: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex-shrink: 0; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #fee2e2; color: #b91c1c; font-weight: 600; }
  .badge.work { background: #dcfce7; color: #166534; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0 8px; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .map-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .map-table td, .map-table th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  .map-table th { background: #f8fafc; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 200; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

</style>
</head>
<body>

<header class="top">
  <h1>생산 · 자재 관리</h1>
  <nav class="tabs">
    <button class="tab" data-tab="sched">생산 일정 월력</button>
    <button class="tab" data-tab="mat">자재 발주 · 재고 현황</button>
  </nav>
  <div class="top-right">
    <span class="save-state" id="saveState"></span>
    <button class="sm" id="btnBackup" title="모든 데이터를 JSON 파일로 저장">백업 저장</button>
    <button class="sm" id="btnRestore" title="백업 JSON 파일에서 불러오기">백업 불러오기</button>
    <input type="file" id="fileRestore" accept=".json,application/json" hidden>
  </div>
</header>
<div class="notice" id="notice" hidden>
  <span>ⓘ 데이터는 이 PC의 브라우저(크롬/엣지)에 자동 저장됩니다. 다른 PC로 옮기거나 브라우저 기록을 지우기 전에는 <b>[백업 저장]</b>으로 파일을 보관하세요.</span>
  <button class="sm ghost" id="noticeClose">닫기 ✕</button>
</div>

<main>
  <!-- ================= 탭1: 생산 일정 월력 ================= -->
  <section class="tab-page" id="page-sched">
    <div class="sched-layout">
      <div class="pane left">
        <div class="pane-head">
          <h2>모델 생산 현황</h2>
          <div class="seg filter-seg" style="margin-left:auto"></div>
          <button class="primary sm" id="btnAddModel">+ 모델 등록</button>
        </div>
        <div class="pane-body" id="modelList"></div>
      </div>
      <div class="pane cal-pane">
        <div class="pane-head">
          <button class="sm" id="calPrev">◀</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="sm" id="calNext">▶</button>
          <button class="sm" id="calToday">오늘</button>
          <div class="seg filter-seg"></div>
          <div class="cal-summary" id="calSummary"></div>
        </div>
        <div class="cal-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </section>

  <!-- ================= 탭2: 자재 ================= -->
  <section class="tab-page" id="page-mat" hidden>
    <div class="stats" id="matStats"></div>
    <div class="mat-toolbar">
      <button class="primary" id="btnAddRow">+ 행 추가</button>
      <button class="danger" id="btnDelRows">선택 삭제</button>
      <input class="search" id="matSearch" placeholder="검색 (품목, 자재명, 코드, 비고…)">
      <select id="fltApproval"><option value="">승인여부: 전체</option></select>
      <select id="fltStatus"><option value="">진행 상황: 전체</option></select>
      <span class="grow"></span>
      <button id="btnCsvUpload">CSV 업로드</button>
      <input type="file" id="fileCsv" accept=".csv,.txt,text/csv" hidden>
      <button id="btnCsvTemplate" title="업로드용 CSV 양식 받기">CSV 양식</button>
      <button id="btnCsvExport">CSV 내보내기</button>
      <button class="primary" id="btnXlsx">엑셀(.xlsx) 내보내기</button>
    </div>
    <div class="table-wrap">
      <table class="mat">
        <thead id="matHead"></thead>
        <tbody id="matBody"></tbody>
      </table>
      <div class="empty" id="matEmpty" hidden>
        자재 목록이 비어 있습니다.<br>
        <b>[CSV 업로드]</b>로 목록을 가져오거나 <b>[+ 행 추가]</b>로 직접 입력하세요.
      </div>
    </div>
  </section>
</main>

<script>
'use strict';

/* =====================================================================
 * 상수
 * ===================================================================== */
const STORE_KEY = 'pm_data_v1';
const UI_KEY = 'pm_ui_v1';
const LINES = ['LCM', 'SET'];
const PALETTE = ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2', '#65a30d', '#ea580c', '#4f46e5', '#0d9488', '#be123c'];
const APPROVALS = ['승인', '미승인', '보류'];
const STATUSES = ['미발주', '발주요청', '발주완료', '입고대기', '입고완료'];
const NO_CODE = '채번x';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

// 한국 공휴일 (대체공휴일·선거일 포함). 회사 휴무/특근은 달력에서 날짜를 눌러 조정.
const HOLIDAYS = {

  '2025-03-01': '삼일절', '2025-03-03': '대체공휴일', '2025-05-05': '어린이날·부처님오신날', '2025-05-06': '대체공휴일',
  '2025-06-03': '대통령선거', '2025-06-06': '현충일', '2025-08-15': '광복절', '2025-10-03': '개천절',
  '2025-10-05': '추석 연휴', '2025-10-06': '추석', '2025-10-07': '추석 연휴', '2025-10-08': '대체공휴일', '2025-10-09': '한글날', '2025-12-25': '성탄절',

  '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
  '2026-03-01': '삼일절', '2026-03-02': '대체공휴일', '2026-05-05': '어린이날', '2026-05-24': '부처님오신날', '2026-05-25': '대체공휴일',
  '2026-06-03': '지방선거', '2026-06-06': '현충일', '2026-08-15': '광복절', '2026-08-17': '대체공휴일',
  '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴', '2026-10-03': '개천절', '2026-10-05': '대체공휴일',

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const fmt = n => (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('ko-KR');
const toInt = v => { const n = parseInt(String(v ?? '').replace(/[,\s]/g, ''), 10); return isNaN(n) ? 0 : Math.max(0, n); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateLabel = s => `${s.slice(0, 4)}.${s.slice(5, 7)}.${s.slice(8)} (${DOW[parseYmd(s).getDay()]})`;
const shortDate = s => s ? `${+s.slice(5, 7)}/${+s.slice(8)}(${DOW[parseYmd(s).getDay()]})` : '-';

function toast(msg, ms = 2200) {

function defaultState() {
  return { version: 1, models: [], holidays: { custom: {}, removed: [] }, materials: [] };
}

function normalizeState(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  d.models = Array.isArray(s.models) ? s.models.map(m => ({
    id: m.id || uid(), name: m.name || '(이름 없음)', color: m.color || PALETTE[0], memo: m.memo || '',
    lines: Object.fromEntries(LINES.map(L => {
      const l = (m.lines && m.lines[L]) || {};
      return [L, { enabled: l.enabled !== false, start: isYmd(l.start) ? l.start : '', total: toInt(l.total), daily: toInt(l.daily), overrides: (l.overrides && typeof l.overrides === 'object') ? l.overrides : {} }];
    })),
  })) : [];
  if (s.holidays) {
    d.holidays.custom = (s.holidays.custom && typeof s.holidays.custom === 'object' && !Array.isArray(s.holidays.custom)) ? s.holidays.custom
      : Object.fromEntries((s.holidays.custom || []).map(x => [x, '회사 휴무']));
    d.holidays.removed = Array.isArray(s.holidays.removed) ? s.holidays.removed : [];
  }
  d.materials = Array.isArray(s.materials) ? s.materials.map(r => ({
    id: r.id || uid(), category: r.category ?? '', name: r.name ?? '', code: r.code ?? '', note1: r.note1 ?? '',
    approval: r.approval ?? '', orderQty: r.orderQty ?? '', orderStatus: r.orderStatus ?? '', stockQty: r.stockQty ?? '', note2: r.note2 ?? '',
  })) : [];
  return d;
}

function openModal({ title, body, wide = false, buttons = [], leftButtons = [], onOpen }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog">
    <div class="modal-head"><h3>${title}</h3><button class="ghost sm x" data-close>✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><div class="left"></div></div>
  </div>`;
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const foot = $('.modal-foot', back);
  const mk = (b, parent) => {
    const el = document.createElement('button');
    el.textContent = b.label; if (b.cls) el.className = b.cls;
    el.addEventListener('click', () => { if (b.onClick) { if (b.onClick(close, back) !== false) close(); } else close(); });
    parent.appendChild(el);
    return el;
  };
  leftButtons.forEach(b => mk(b, $('.left', foot)));
  buttons.forEach(b => mk(b, foot));
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  $('[data-close]', back).addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
  if (onOpen) onOpen(back, close);
  const f = $('input:not([type=checkbox]):not([type=color]), select', $('.modal-body', back));
  if (f) setTimeout(() => f.focus(), 30);
  return { back, close };
}

/* =====================================================================

 * ===================================================================== */
function holidayInfo(s) {
  const w = parseYmd(s).getDay();
  const baseOff = w === 0 || w === 6 || !!HOLIDAYS[s];
  const baseName = HOLIDAYS[s] || '';
  if (state.holidays.removed.includes(s)) return { off: false, name: baseOff ? '근무일(특근)' : '', type: 'work', baseOff, baseName };
  if (Object.prototype.hasOwnProperty.call(state.holidays.custom, s)) return { off: true, name: state.holidays.custom[s] || '회사 휴무', type: 'custom', baseOff, baseName };
  if (HOLIDAYS[s]) return { off: true, name: HOLIDAYS[s], type: 'public', baseOff, baseName };
  if (baseOff) return { off: true, name: '', type: 'weekend', baseOff, baseName };
  return { off: false, name: '', type: '', baseOff, baseName };
}

/**
 * 시작일부터 휴일을 건너뛰며 하루 생산 대수를 배분.
 * overrides[date] 가 있으면 그날은 그 수량(0이면 생산 제외, 휴일이면 특근으로 인정).
 */
function buildSchedule(line) {
  const out = [];
  if (!line || !line.enabled) return out;
  const total = toInt(line.total), daily = toInt(line.daily);
  if (!total || !isYmd(line.start)) return out;
  const ov = line.overrides || {};
  const ovDates = Object.keys(ov).sort();
  let remain = total;

  ovDates.filter(d => d < line.start).forEach(d => {
    const q = Math.min(remain, toInt(ov[d]));
    if (q > 0) { out.push({ date: d, qty: q, override: true }); remain -= q; }
  });

  const lastOv = ovDates[ovDates.length - 1] || '';
  let d = line.start;
  for (let guard = 0; remain > 0 && guard < 3660; guard++) {
    const has = Object.prototype.hasOwnProperty.call(ov, d);
    if (!has && daily === 0 && d > lastOv) break;
    let q = has ? toInt(ov[d]) : (holidayInfo(d).off ? 0 : daily);
    q = Math.min(q, remain);
    if (q > 0) { out.push({ date: d, qty: q, override: has }); remain -= q; }
    d = addDays(d, 1);
  }
  return out;
}

function lineStats(line) {
  const items = buildSchedule(line);
  const sum = items.reduce((a, b) => a + b.qty, 0);
  const total = line.enabled ? toInt(line.total) : 0;
  const t = todayStr();
  const done = items.filter(it => it.date <= t).reduce((a, b) => a + b.qty, 0);
  return {
    items, sum, total, done, remain: total - sum, days: items.length,
    first: items.length ? items[0].date : '', end: items.length ? items[items.length - 1].date : '',
  };
}

function computeAll() {
  const byDate = {}, info = {};
  state.models.forEach(m => {
    info[m.id] = {};
    LINES.forEach(L => {
      const st = lineStats(m.lines[L]);
      info[m.id][L] = st;
      st.items.forEach(it => (byDate[it.date] || (byDate[it.date] = [])).push({ m, L, qty: it.qty, override: it.override }));
    });
  });
  Object.values(byDate).forEach(arr => arr.sort((a, b) => a.L.localeCompare(b.L)));
  return { byDate, info };
}

function statusOf(i) {
  if (!i.days) return { k: 'none', label: '미설정' };
  const t = todayStr();
  if (t < i.first) {
    const dd = Math.round((parseYmd(i.first) - parseYmd(t)) / 86400000);
    return { k: 'plan', label: `예정 D-${dd}` };
  }
  if (t > i.end) return { k: 'done', label: '완료' };
  return { k: 'run', label: '진행중' };
}

function lineDynHtml(m, L, i) {
  const ln = m.lines[L];
  const ovCount = Object.keys(ln.overrides || {}).length;
  const pct = i.total ? Math.min(100, Math.round(i.done / i.total * 100)) : 0;
  let warn = '';
  if (!ln.start) warn = '<span class="warn">시작일을 입력하세요</span>';
  else if (!i.total) warn = '<span class="warn">총 대수를 입력하세요</span>';
  else if (i.remain > 0) warn = `<span class="warn">미배정 ${fmt(i.remain)}대 (하루 대수 확인)</span>`;
  return `
    <div>${shortDate(i.first)} ~ <b>${shortDate(i.end)}</b> · 생산 ${i.days}일
      ${ovCount ? ` · <a class="link" data-act="reset-ov">개별 수정 ${ovCount}건 초기화</a>` : ''}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div>오늘까지 계획 <b>${fmt(i.done)}</b> / ${fmt(i.total)}대 (${pct}%) ${warn}</div>`;
}

          $$('.line-box', back).forEach(box => { m.lines[box.dataset.line] = readLineBox(box); });
          state.models.push(m);
          save(); renderSched();
          toast(`'${name}' 등록 완료`);
        },
      },
    ],
  });
}
function readLineBox(box) {
  return {
    enabled: $('[name=en]', box).checked,
    start: isYmd($('[name=start]', box).value) ? $('[name=start]', box).value : '',
    total: toInt($('[name=total]', box).value),
    daily: toInt($('[name=daily]', box).value),
    overrides: {},
  };
}
$('#btnAddModel').addEventListener('click', () => openModelModal());

/* ---------- 달력 ---------- */
function renderCalendar(all) {
  const { y, m } = view;
  $('#calTitle').textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1);
  const dim = new Date(y, m + 1, 0).getDate();
  const startDow = first.getDay();
  const weeks = Math.ceil((startDow + dim) / 7);
  const t = todayStr();
  const monthPrefix = `${y}-${pad(m + 1)}`;
  const monthSum = { LCM: 0, SET: 0 };
  let html = '';
  for (let i = 0; i < weeks * 7; i++) {
    const ds = ymd(new Date(y, m, 1 - startDow + i));
    const hi = holidayInfo(ds);
    const dow = parseYmd(ds).getDay();
    const entries = (all.byDate[ds] || []).filter(x => showLine(x.L));
    const sum = { LCM: 0, SET: 0 };
    entries.forEach(x => { sum[x.L] += x.qty; if (ds.startsWith(monthPrefix)) monthSum[x.L] += x.qty; });
    const cls = ['cal-cell', ds.startsWith(monthPrefix) ? '' : 'other', hi.off ? 'off' : '', ds === t ? 'today' : '',
      dow === 0 ? 'sun' : '', dow === 6 ? 'sat' : '', (hi.type === 'public' || hi.type === 'custom') ? 'hol' : ''].join(' ');
    const chips = entries.map(x => `
      <div class="chip ${x.L.toLowerCase()}" style="--c:${esc(x.m.color)}" data-mid="${x.m.id}" data-line="${x.L}" data-date="${ds}"
           title="${esc(x.m.name)} · ${x.L} · ${fmt(x.qty)}대${x.override ? ' (개별 수정)' : ''}">
        <span class="nm">${esc(x.m.name)}</span><span class="ln">${x.L === 'LCM' ? 'L' : 'S'}</span><b>${fmt(x.qty)}</b>${x.override ? '<span class="ov">✎</span>' : ''}
      </div>`).join('');
    const sumTxt = [sum.LCM ? `L ${fmt(sum.LCM)}` : '', sum.SET ? `S ${fmt(sum.SET)}` : ''].filter(Boolean).join(' · ');
    html += `<div class="${cls}" data-date="${ds}">
      <div class="cal-head"><span class="dnum">${+ds.slice(8)}</span><span class="hname ${hi.type === 'work' ? 'work' : ''}" title="${esc(hi.name)}">${esc(hi.name)}</span></div>
      <div class="chips">${chips}</div>
      ${sumTxt ? `<div class="cal-sum">${sumTxt}</div>` : ''}
    </div>`;
  }
  const grid = $('#calGrid');
  grid.style.gridTemplateRows = `repeat(${weeks}, minmax(96px, 1fr))`;
  grid.innerHTML = html;
  $('#calSummary').innerHTML = `이번 달 계획 ${showLine('LCM') ? `LCM <b>${fmt(monthSum.LCM)}</b>대` : ''}${lineFilter === 'ALL' ? ' · ' : ''}${showLine('SET') ? `SET <b>${fmt(monthSum.SET)}</b>대` : ''}`;
}

$('#calPrev').addEventListener('click', () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } renderCalendar(computeAll()); });
$('#calNext').addEventListener('click', () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } renderCalendar(computeAll()); });
$('#calToday').addEventListener('click', () => { const n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); renderCalendar(computeAll()); });

$('#calGrid').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { openChipModal(chip.dataset.mid, chip.dataset.line, chip.dataset.date); return; }
  const cell = e.target.closest('.cal-cell');
  if (cell) openDayModal(cell.dataset.date);
});

/* 칩 클릭: 그날 수량 수정 */
function openChipModal(mid, L, ds) {
  const m = modelById(mid); if (!m) return;
  const ln = m.lines[L];
  const cur = (lineStats(ln).items.find(it => it.date === ds) || { qty: 0 }).qty;
  const hasOv = Object.prototype.hasOwnProperty.call(ln.overrides, ds);
  const apply = (newQ, adjustTotal) => {
    if (adjustTotal) ln.total = Math.max(0, toInt(ln.total) + newQ - cur);
    ln.overrides[ds] = newQ;
    save(); renderSched();
  };
  openModal({
    title: `<span class="dot" style="--c:${esc(m.color)};display:inline-block;margin-right:6px"></span>${esc(m.name)} · ${L} · ${dateLabel(ds)}`,
    body: `
      <label class="form-row"><span>이 날 생산 수량 (현재 ${fmt(cur)}대${hasOv ? ', 개별 수정됨' : ', 자동 배분'})</span>
        <input type="number" min="0" name="qty" value="${cur}"></label>
      <label class="check"><input type="checkbox" name="adj"> 총 생산 대수도 함께 변경 (현재 총 ${fmt(ln.total)}대)</label>
      <div class="hint">체크하지 않으면 총 대수는 그대로이고, 이후 일정이 자동으로 당겨지거나 밀립니다.</div>`,
    leftButtons: [
      { label: '이 날 생산 제외', cls: 'danger', onClick(c, back) { apply(0, $('[name=adj]', back).checked); toast('해당 날짜 생산을 제외했습니다'); } },
      ...(hasOv ? [{ label: '자동 배분으로 되돌리기', onClick() { delete ln.overrides[ds]; save(); renderSched(); } }] : []),
    ],
    buttons: [
      { label: '취소' },
      { label: '저장', cls: 'primary', onClick(c, back) { apply(toInt($('[name=qty]', back).value), $('[name=adj]', back).checked); } },
    ],
    onOpen(back) { $('[name=qty]', back).addEventListener('keydown', e => { if (e.key === 'Enter') $('.modal-foot button.primary', back).click(); }); },
  });
}

/* 날짜 클릭: 생산 1건 추가 / 새 모델 / 휴무 지정 */
function openDayModal(ds) {
  const all = computeAll();
  const hi = holidayInfo(ds);
  const entries = all.byDate[ds] || [];
  const hasModels = state.models.length > 0;
  const badge = hi.off ? `<span class="badge">${esc(hi.name || '주말')}</span>` : (hi.type === 'work' ? '<span class="badge work">근무일(특근)</span>' : '');

  const body = `
    <div style="display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700">${dateLabel(ds)} ${badge}</div>
    <div class="section-title">이 날 생산 계획</div>
    <div class="day-list">${entries.length ? entries.map(x => `
      <div class="day-item"><span class="dot" style="--c:${esc(x.m.color)}"></span>
        <span style="flex:1">${esc(x.m.name)} <b>${x.L}</b> ${fmt(x.qty)}대${x.override ? ' ✎' : ''}</span>
        <button class="sm" data-edit="${x.m.id}|${x.L}">수정</button></div>`).join('') : '<div class="hint">계획된 생산이 없습니다.</div>'}
    </div>
    ${hasModels ? `
    <div class="section-title">생산 1건 추가</div>
    <div class="form-inline">
      <label class="form-row" style="flex:2"><span>모델</span><select name="mid">${state.models.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>
      <label class="form-row"><span>공정</span><select name="line">${LINES.map(L => `<option ${lineFilter === L ? 'selected' : ''}>${L}</option>`).join('')}</select></label>
      <label class="form-row"><span>수량</span><input type="number" min="0" name="qty"></label>
    </div>
    <label class="check"><input type="checkbox" name="addTotal"> 총 생산 대수에 추가</label>
    <div class="hint" id="addHint"></div>` : ''}
    <div class="section-title">휴일 설정</div>
    <div class="form-inline">
      ${hi.off
        ? `<button name="setWork">이 날 근무(특근)로 지정</button>`
        : `<label class="form-row" style="flex:2"><span>휴무 사유</span><input name="holName" placeholder="회사 휴무"></label><button name="setOff">휴무일로 지정</button>`}
      ${(hi.type === 'custom' || hi.type === 'work') ? `<button class="ghost" name="resetHol">기본값으로</button>` : ''}
    </div>
    <div class="hint" style="margin-top:6px">휴무일로 바꾸면 그날의 자동 배분 생산은 다음 근무일로 밀립니다.</div>`;

  const buttons = [{ label: '닫기' }];
  if (hasModels) buttons.push({
    label: '추가', cls: 'primary', onClick(close, back) {
      const m = modelById($('[name=mid]', back).value); const L = $('[name=line]', back).value;
      const q = toInt($('[name=qty]', back).value);
      if (!q) { toast('수량을 입력하세요'); return false; }
      const ln = m.lines[L];
      const st = lineStats(ln);
      const cur = (st.items.find(it => it.date === ds) || { qty: 0 }).qty;
      if (!ln.enabled || !ln.start || !toInt(ln.total)) {
        ln.enabled = true; ln.start = ln.start || ds; ln.daily = ln.daily || q;
        ln.total = toInt(ln.total) + q;
      } else if ($('[name=addTotal]', back).checked) {
        ln.total = toInt(ln.total) + Math.max(0, q - cur);
      }
      ln.overrides[ds] = q;
      save(); renderSched();
      toast(`${m.name} ${L} ${fmt(q)}대 추가`);
    },
  });

  openModal({
    title: '날짜 관리', body, buttons,
    leftButtons: [{ label: '+ 이 날짜로 새 모델 등록', onClick() { setTimeout(() => openModelModal(ds), 0); } }],
    onOpen(back, close) {
      $$('[data-edit]', back).forEach(b => b.addEventListener('click', () => {
        const [mid, L] = b.dataset.edit.split('|'); close(); openChipModal(mid, L, ds);
      }));
      const syncAdd = () => {
        if (!hasModels) return;
        const m = modelById($('[name=mid]', back).value); const L = $('[name=line]', back).value;
        const ln = m.lines[L]; const st = lineStats(ln);
        const cur = (st.items.find(it => it.date === ds) || { qty: 0 }).qty;
        $('[name=qty]', back).value = cur || ln.daily || '';
        const beyond = !st.days || ds > st.end;
        $('[name=addTotal]', back).checked = beyond;
        $('#addHint', back).textContent = !ln.enabled || !st.days
          ? `${L} 일정이 없어 이 날짜를 시작일로 새로 만듭니다.`
          : cur ? `이미 ${fmt(cur)}대 계획되어 있습니다. 입력한 수량으로 바뀝니다.`
          : beyond ? `현재 종료일(${shortDate(st.end)}) 이후 날짜라서 총 대수에 더해야 표시됩니다.`
          : '체크하지 않으면 총 대수는 유지되고 일정이 당겨집니다.';
      };
      if (hasModels) { $('[name=mid]', back).addEventListener('change', syncAdd); $('[name=line]', back).addEventListener('change', syncAdd); syncAdd(); }
      const h = state.holidays;
      const done = () => { save(); close(); renderSched(); };
      const on = (n, fn) => { const el = $(`[name=${n}]`, back); if (el) el.addEventListener('click', fn); };
      on('setWork', () => { delete h.custom[ds]; if (holidayInfo(ds).off && !h.removed.includes(ds)) h.removed.push(ds); done(); });
      on('setOff', () => {
        h.removed = h.removed.filter(x => x !== ds);
        if (!holidayInfo(ds).off) h.custom[ds] = $('[name=holName]', back).value.trim() || '회사 휴무';
        done();
      });
      on('resetHol', () => { delete h.custom[ds]; h.removed = h.removed.filter(x => x !== ds); done(); });
    },
  });
}

/* =====================================================================
 * 탭2: 자재 발주 · 재고
 * ===================================================================== */
let matSort = { key: null, dir: 1 };
let matQuick = '';   // 'nocode' | 'unapproved' | 'notordered' | ''
const selected = new Set();

function renderMatHead() {
  $('#matHead').innerHTML = `<tr>
    <th class="chk nosort"><input type="checkbox" id="chkAll" title="전체 선택"></th>
    <th class="nosort">No</th>
    ${MAT_COLS.map(c => `<th data-key="${c.key}">${c.label} <span class="arrow">${matSort.key === c.key ? (matSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`).join('')}
  </tr>`;
}

function matFilterOptions() {
  const fill = (sel, base, key, label) => {
    const cur = sel.value;
    const vals = [...new Set([...base, ...state.materials.map(r => r[key]).filter(Boolean)])];
    sel.innerHTML = `<option value="">${label}: 전체</option>` + vals.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  };
  fill($('#fltApproval'), APPROVALS, 'approval', '승인여부');
  fill($('#fltStatus'), STATUSES, 'orderStatus', '진행 상황');
}

function filteredMaterials() {
  const q = $('#matSearch').value.trim().toLowerCase();
  const fa = $('#fltApproval').value, fs = $('#fltStatus').value;
  let rows = state.materials.filter(r => {
    if (fa && r.approval !== fa) return false;
    if (fs && r.orderStatus !== fs) return false;
    if (matQuick === 'nocode' && String(r.code).trim()) return false;
    if (matQuick === 'unapproved' && r.approval === '승인') return false;
    if (matQuick === 'notordered' && !(r.orderStatus === '' || r.orderStatus === '미발주')) return false;
    if (q && !MAT_COLS.some(c => String(c.key === 'code' && !r.code ? NO_CODE : r[c.key]).toLowerCase().includes(q))) return false;
    return true;
  });
  if (matSort.key) {
    const col = MAT_COLS.find(c => c.key === matSort.key);
    rows = rows.slice().sort((a, b) => {
      const va = a[col.key], vb = b[col.key];
      if (col.type === 'num') return ((va === '' ? -1 : +va) - (vb === '' ? -1 : +vb)) * matSort.dir;
      return String(va).localeCompare(String(vb), 'ko', { numeric: true }) * matSort.dir;
    });
  }
  return rows;
}

function cellHtml(r, c) {
  const v = r[c.key] ?? '';
  if (c.type === 'select') {
    const opts = [...c.options]; if (v && !opts.includes(v)) opts.push(v);
    return `<td><select class="cell" data-key="${c.key}" data-v="${esc(v)}">
      <option value=""></option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      <option value="__custom">직접 입력…</option></select></td>`;
  }
  if (c.type === 'num') return `<td><input class="cell num" data-key="${c.key}" inputmode="numeric" value="${fmt(v)}"></td>`;
  if (c.key === 'code') return `<td><input class="cell code" data-key="code" placeholder="${NO_CODE}" value="${esc(v)}"></td>`;
  return `<td><input class="cell" data-key="${c.key}" value="${esc(v)}" title="${esc(v)}"></td>`;
}

function renderMaterials() {
  renderMatHead();
  const rows = filteredMaterials();
  $('#matBody').innerHTML = rows.map((r, i) => `
    <tr data-id="${r.id}" class="${selected.has(r.id) ? 'sel' : ''}">
      <td class="chk"><input type="checkbox" class="row-chk" ${selected.has(r.id) ? 'checked' : ''}></td>
      <td class="idx">${i + 1}</td>
      ${MAT_COLS.map(c => cellHtml(r, c)).join('')}
    </tr>`).join('');
  $('#matEmpty').hidden = rows.length > 0;
  $('#matEmpty').innerHTML = state.materials.length
    ? '조건에 맞는 자재가 없습니다.'
    : '자재 목록이 비어 있습니다.<br><b>[CSV 업로드]</b>로 목록을 가져오거나 <b>[+ 행 추가]</b>로 직접 입력하세요.';
  renderMatStats();
}

function renderMatStats() {
  const M = state.materials;
  const stats = [
    ['', '전체 자재', M.length],
    ['nocode', `${NO_CODE} (코드 미채번)`, M.filter(r => !String(r.code).trim()).length, 'red'],
    ['unapproved', '승인 안 됨', M.filter(r => r.approval !== '승인').length],
    ['notordered', '미발주', M.filter(r => r.orderStatus === '' || r.orderStatus === '미발주').length],
  ];
  $('#matStats').innerHTML = stats.map(([k, label, v, cls]) =>
    `<button class="stat ${cls || ''} ${matQuick === k ? 'on' : ''}" data-q="${k}"><span class="v">${fmt(v)}</span><span class="k">${label}</span></button>`).join('')
    + `<button class="stat" data-q="__stock" style="cursor:default"><span class="v">${fmt(M.filter(r => r.orderStatus === '입고완료').length)}</span><span class="k">입고 완료</span></button>`;
}
$('#matStats').addEventListener('click', e => {
  const b = e.target.closest('.stat'); if (!b || b.dataset.q === '__stock') return;
  matQuick = matQuick === b.dataset.q ? '' : b.dataset.q;
  renderMaterials();
});

function matById(id) { return state.materials.find(r => r.id === id); }

function newMaterial(p = {}) {
  return { id: uid(), category: '', name: '', code: '', note1: '', approval: '미승인', orderQty: '', orderStatus: '미발주', stockQty: '', note2: '', ...p };
}

$('#btnAddRow').addEventListener('click', () => {
  const r = newMaterial();
  state.materials.push(r);
  $('#matSearch').value = ''; $('#fltApproval').value = ''; $('#fltStatus').value = ''; matQuick = ''; matSort.key = null;
  save(); matFilterOptions(); renderMaterials();
  const inp = $(`tr[data-id="${r.id}"] .cell`);
  if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); }

$('#btnDelRows').addEventListener('click', () => {
  if (!selected.size) { toast('삭제할 행을 체크하세요'); return; }
  if (!confirm(`선택한 ${selected.size}개 행을 삭제할까요?`)) return;
  state.materials = state.materials.filter(r => !selected.has(r.id));
  selected.clear(); save(); matFilterOptions(); renderMaterials();
});

$('#matSearch').addEventListener('input', renderMaterials);
$('#fltApproval').addEventListener('change', renderMaterials);
$('#fltStatus').addEventListener('change', renderMaterials);

$('#matHead').addEventListener('click', e => {
  if (e.target.id === 'chkAll') {
    const rows = filteredMaterials();
    rows.forEach(r => e.target.checked ? selected.add(r.id) : selected.delete(r.id));
    renderMaterials(); $('#chkAll').checked = e.target.checked; return;
  }
  const th = e.target.closest('th[data-key]'); if (!th) return;
  if (matSort.key !== th.dataset.key) matSort = { key: th.dataset.key, dir: 1 };
  else if (matSort.dir === 1) matSort.dir = -1;
  else matSort = { key: null, dir: 1 };
  renderMaterials();
});

const tbody = $('#matBody');
tbody.addEventListener('input', e => {
  const el = e.target; const tr = el.closest('tr'); if (!tr || !el.dataset.key) return;
  const r = matById(tr.dataset.id); if (!r) return;
  const col = MAT_COLS.find(c => c.key === el.dataset.key);
  if (col.type === 'select') return;
  if (col.type === 'num') {
    const raw = el.value.replace(/[,\s]/g, '');
    r[col.key] = raw === '' || isNaN(raw) ? '' : Math.max(0, Math.round(+raw));
  } else {
    r[col.key] = col.key === 'code' && el.value.trim() === NO_CODE ? '' : el.value;
    el.title = el.value;
  }
  save();
  if (col.key === 'code') renderMatStats();
});
tbody.addEventListener('change', e => {
  const el = e.target; const tr = el.closest('tr'); if (!tr) return;
  const r = matById(tr.dataset.id);
  if (el.classList.contains('row-chk')) {
    el.checked ? selected.add(r.id) : selected.delete(r.id);
    tr.classList.toggle('sel', el.checked); return;
  }
  const col = MAT_COLS.find(c => c.key === el.dataset.key); if (!col) return;
  if (col.type === 'num') { el.value = fmt(r[col.key]); return; }
  if (col.type === 'select') {
    let v = el.value;
    if (v === '__custom') {
      const input = prompt(`${col.label} 값을 입력하세요`, r[col.key] || '');
      if (input === null) { el.value = r[col.key]; return; }
      v = input.trim();
      if (v && !$$('option', el).some(o => o.value === v)) {
        const o = document.createElement('option'); o.textContent = v;
        el.insertBefore(o, el.lastElementChild);
      }
      el.value = v;
    }
    r[col.key] = v; el.dataset.v = v;
    save(); renderMatStats(); matFilterOptions();
  }
});
// 엑셀처럼 Enter 로 아래 칸 이동
tbody.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('cell') || e.isComposing) return;
  e.preventDefault();
  const tr = e.target.closest('tr');
  const next = (e.shiftKey ? tr.previousElementSibling : tr.nextElementSibling);
  if (next) { const n = $(`.cell[data-key="${e.target.dataset.key}"]`, next); if (n) { n.focus(); if (n.select) n.select(); } }
  else e.target.blur();
});

/* ---------- CSV ---------- */
function decodeText(buf) {
  // 윈도우 엑셀에서 저장한 CSV는 대부분 CP949(EUC-KR). UTF-8로 먼저 시도 후 실패하면 EUC-KR.
  const bytes = new Uint8Array(buf);
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, ''), enc: 'UTF-8' };
  } catch (e) {
    return { text: new TextDecoder('euc-kr').decode(bytes), enc: 'EUC-KR(CP949)' };
  }
}

function parseCSV(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = (firstLine.split('\t').length > firstLine.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

const HEADER_ALIASES = {
  category: ['품목', '품목구분', '구분', '분류', '품목명'],
  name: ['자재명', '품명', '자재', '부품명'],
  code: ['자재코드', '코드', '품번', '자재번호', 'partno', 'code'],
  approval: ['승인여부', '승인', '승인상태'],
  orderQty: ['발주수량', '발주량', '발주'],
  orderStatus: ['발주진행상황', '진행상황', '발주상황', '발주진행', '발주상태'],
  stockQty: ['보유수량', '보유', '재고', '재고수량', '현재고'],
  note: ['비고', '메모', '비고1', '비고2', 'note', 'remark'],
};
const normHeader = s => String(s).toLowerCase().replace(/[\s_\-·./()]/g, '');

function mapHeader(header) {
  const map = []; let noteSeen = 0, hits = 0;
  header.forEach((h, idx) => {
    const n = normHeader(h);
    const key = Object.keys(HEADER_ALIASES).find(k => HEADER_ALIASES[k].includes(n));
    if (!key) { map[idx] = null; return; }
    hits++;
    if (key === 'note') { map[idx] = noteSeen === 0 ? 'note1' : (noteSeen === 1 ? 'note2' : null); noteSeen++; }
    else map[idx] = map.includes(key) ? null : key;
  });
  return { map, hits };
}

function csvToMaterials(rows) {
  if (!rows.length) return { items: [], hasHeader: false, map: [] };
  let { map, hits } = mapHeader(rows[0]);
  let hasHeader = hits >= 2;
  if (!hasHeader) map = MAT_COLS.map(c => c.key); // 헤더가 없으면 양식 순서대로
  const body = hasHeader ? rows.slice(1) : rows;
  const items = body.map(cells => {
    const r = newMaterial({ approval: '', orderStatus: '' });
    map.forEach((key, idx) => {
      if (!key) return;
      let v = (cells[idx] ?? '').trim();
      if (key === 'orderQty' || key === 'stockQty') { const raw = v.replace(/[,\s]/g, ''); v = raw === '' || isNaN(raw) ? '' : Math.max(0, Math.round(+raw)); }
      if (key === 'code' && v.replace(/\s/g, '').toLowerCase() === NO_CODE) v = '';
      r[key] = v;
    });
    return r;
  });
  return { items, hasHeader, map, header: rows[0] };
}

/* ---------- XLSX 작성 (외부 라이브러리 없이 무압축 ZIP) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files, mime) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const n = new Date();
  const dosTime = (n.getHours() << 11) | (n.getMinutes() << 5) | Math.floor(n.getSeconds() / 2);
  const dosDate = ((n.getFullYear() - 1980) << 9) | ((n.getMonth() + 1) << 5) | n.getDate();
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime });
}

// XML에 넣을 수 없는 제어문자 (0x00-0x08, 0x0B, 0x0C, 0x0E-0x1F)
const XML_BAD_CHARS = new RegExp('[' + [[0, 8], [11, 12], [14, 31]].map(([a, b]) => String.fromCharCode(a) + '-' + String.fromCharCode(b)).join('') + ']', 'g');
function xmlEsc(s) {
  return String(s ?? '').replace(XML_BAD_CHARS, '')
    .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function buildXlsx() {
  const SHEET = '자재발주현황';
  const colL = i => String.fromCharCode(65 + i);
  const rows = exportRows();
  const lastRow = rows.length + 1;
  const lastCol = colL(MAT_COLS.length - 1);
  // 스타일: 1=헤더, 2=텍스트, 3=숫자(#,##0), 4=채번x(빨강)
  const strCell = (ref, v, s) => `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  let sheetData = `<row r="1" ht="22" customHeight="1">${MAT_COLS.map((c, i) => strCell(`${colL(i)}1`, c.label, 1)).join('')}</row>`;
  rows.forEach((r, ri) => {
    const rn = ri + 2;
    sheetData += `<row r="${rn}">` + r.map((v, ci) => {
      const ref = `${colL(ci)}${rn}`, col = MAT_COLS[ci];
      if (col.type === 'num' && v !== '' && v != null && !isNaN(v)) return `<c r="${ref}" s="3"><v>${+v}</v></c>`;
      if (col.key === 'code' && v === NO_CODE) return strCell(ref, v, 4);
      return strCell(ref, v, 2);
    }).join('') + '</row>';
  });
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<dimension ref="A1:${lastCol}${lastRow}"/>
<sheetViews><sheetView workbookViewId="0" tabSelected="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="16.5"/>
<cols>${MAT_COLS.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.xw}" customWidth="1"/>`).join('')}</cols>
<sheetData>${sheetData}</sheetData>
<autoFilter ref="A1:${lastCol}${lastRow}"/>
<pageMargins left="0.5" right="0.5" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>
</worksheet>`;
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<bookViews><workbookView/></bookViews>
<sheets><sheet name="${SHEET}" sheetId="1" r:id="rId1"/></sheets>
<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${SHEET}'!$A$1:$${lastCol}$${lastRow}</definedName></definedNames>
</workbook>`;
  const border = `<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="3">
  <font><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>
  <font><b/><sz val="10"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>
  <font><b/><sz val="10"/><color rgb="FFDC2626"/><name val="맑은 고딕"/><family val="3"/><charset val="129"/></font>
</fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F1"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${border}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="5">
  <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
  <xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
  <xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
  <xf numFmtId="3" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>
  <xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  return zipStore([
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: workbook },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/worksheets/sheet1.xml', data: sheet },
    { name: 'xl/styles.xml', data: styles },
  ], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
